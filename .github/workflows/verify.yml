# Feature 031-demo-deployment (T029): read-only verification for ordinary
# pushes and pull requests. Runs the locked install and every quality gate,
# but carries no Pages permission, no environment, and no deploy step —
# normal development can never publish the public demo (FR-003/SC-005).
name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Locked install, tests, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
      - name: Locked install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Racer — Core Loop Prototype</title>
    <style>
      :root { color-scheme: dark; background: #0b1514; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; min-width: 100%; min-height: 100%; overflow: hidden; background: #0b1514; }
      body { box-sizing: border-box; }
      #app {
        position: fixed;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 40%, #203d3c 0, #0b1514 72%);
      }
      canvas {
        display: block;
        width: min(100vw, calc(100vh * 16 / 9)) !important;
        height: min(100vh, calc(100vw * 9 / 16)) !important;
        max-width: none !important;
        max-height: none !important;
        image-rendering: auto;
        box-shadow: 0 24px 80px rgba(0, 0, 0, .55);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
